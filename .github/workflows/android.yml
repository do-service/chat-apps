name: Android debug APK (manual)
run-name: Android debug APK run ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Full GitLab main commit SHA (must still be the main tip)"
        required: true
        type: string
        default: "7c9b6686f67a8b9c0bd179e8b405a18514a4d85c"

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build and verify Android debug APK
    if: github.repository == 'do-service/chat-apps' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: android-debug-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out trusted CI helpers without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Test trusted source and artifact helpers
        run: |
          node --test scripts/android-source.test.mjs scripts/android-workflow.test.mjs
          python3 -B -m unittest discover -s scripts -p android_artifact_test.py

      - name: Export only the approved GitLab frontend and mobile snapshot
        env:
          GITLAB_READ_USERNAME: ${{ secrets.GITLAB_READ_USERNAME }}
          GITLAB_READ_TOKEN: ${{ secrets.GITLAB_READ_TOKEN }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          node scripts/android-source.mjs "$RUNNER_TEMP/android-source" > "$RUNNER_TEMP/android-source-meta.json"

      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure the pinned Android SDK packages
        run: |
          test -n "${ANDROID_HOME:-}"
          if ! test -f "$ANDROID_HOME/platforms/android-36/android.jar" || ! test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" || ! test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"; then
            test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
          fi
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"

      - name: Install only the exported locked dependencies
        run: |
          npm --prefix "$RUNNER_TEMP/android-source/frontend" ci
          npm --prefix "$RUNNER_TEMP/android-source/mobile" ci

      - name: Test the exported frontend and mobile contract
        run: |
          npm --prefix "$RUNNER_TEMP/android-source/frontend" test -- --maxWorkers=2
          npm --prefix "$RUNNER_TEMP/android-source/mobile" test
          npm --prefix "$RUNNER_TEMP/android-source/mobile" run typecheck

      - name: Build the bundled frontend
        working-directory: ${{ runner.temp }}/android-source/mobile
        run: npm run build

      - name: Snapshot native inputs before generating Capacitor assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root = Path(os.environ['RUNNER_TEMP']) / 'android-source/mobile/android'
          files = sorted(path for path in root.rglob('*') if path.is_file())
          assert files and all(not path.is_symlink() for path in files)
          state = {path.relative_to(root).as_posix(): hashlib.sha256(path.read_bytes()).hexdigest() for path in files}
          (Path(os.environ['RUNNER_TEMP']) / 'android-native-inputs.json').write_text(json.dumps(state))
          PY

      - name: Generate Android assets without changing reviewed native inputs
        working-directory: ${{ runner.temp }}/android-source/mobile
        run: |
          npm exec --yes=false -- cap sync android
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root = Path.cwd() / 'android'
          state = json.loads((Path(os.environ['RUNNER_TEMP']) / 'android-native-inputs.json').read_text())
          for name, digest in state.items():
              path = root / name
              assert path.is_file() and not path.is_symlink(), 'Native input removed or replaced'
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, 'Capacitor changed a reviewed native input'
          assert not (root / 'app/google-services.json').exists(), 'This preview must not contain Firebase configuration'
          PY
          python3 android/tests/source_checks.py
          node --experimental-strip-types --test android/tests/wire-envelope.test.mjs

      - name: Compile, test, lint, and assemble the debug APK
        working-directory: ${{ runner.temp }}/android-source/mobile/android
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest lintDebug assembleDebug

      - name: Verify APK contents, package identity, signing, and exact upload allowlist
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 scripts/android_artifact.py \
            --source "$RUNNER_TEMP/android-source" \
            --apk "$RUNNER_TEMP/android-source/mobile/android/app/build/outputs/apk/debug/app-debug.apk" \
            --output "$RUNNER_TEMP/android-artifacts" \
            --source-commit "$EXPECTED_SOURCE_SHA" \
            --workflow-commit "$GITHUB_SHA" \
            --build-tools "$ANDROID_HOME/build-tools/36.0.0"

      - name: Remove the private build workspace before publishing artifacts
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, shutil
          base = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          source = base / 'android-source'
          if source.exists() or source.is_symlink():
              assert not source.is_symlink() and source.resolve() == base / 'android-source'
              shutil.rmtree(source)
          for name in ['android-source-meta.json', 'android-native-inputs.json']:
              path = base / name
              if path.exists() or path.is_symlink():
                  assert path.is_file() and not path.is_symlink() and path.resolve().parent == base
                  path.unlink()
          PY

      - name: Upload only the verified test APK, checksums, and unsigned provenance
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chat-android-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/android-artifacts/chat-mobile-preview-debug.apk
            ${{ runner.temp }}/android-artifacts/SHA256SUMS.txt
            ${{ runner.temp }}/android-artifacts/provenance.json
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 3
