appId: ru.exz-vps.chat.desktop.spike
productName: Chat Desktop Spike
asar: true
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  grantFileProtocolExtraPrivileges: false
npmRebuild: false
publish: null
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
artifactName: chat-desktop-spike-${version}-${os}-${arch}.${ext}
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: build/icons/icon.icns
  category: public.app-category.social-networking
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Camera access for calls in Chat.
    NSMicrophoneUsageDescription: Microphone access for calls in Chat.
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icons/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Chat Desktop Spike
linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: build/icons/icon.png
  category: Network
