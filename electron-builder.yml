appId: ru.exz-vps.chat.desktop.spike
productName: Chat Desktop Spike
asar: true
asarUnpack:
  - dist/notification-permission.node
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  grantFileProtocolExtraPrivileges: false
npmRebuild: false
publish:
  provider: github
  owner: do-service
  repo: chat-apps
  channel: preview
  releaseType: prerelease
  private: false
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
artifactName: chat-desktop-spike-${version}-${os}-${arch}.${ext}
mac:
  publish: null
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: build/icons/icon.icns
  category: public.app-category.social-networking
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Camera access for calls in Chat.
    NSMicrophoneUsageDescription: Microphone access for calls in Chat.
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icons/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Chat Desktop Spike
linux:
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
  icon: build/icons/icon.png
  category: Network
